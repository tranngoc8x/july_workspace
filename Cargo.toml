[package]
name = "july-workspace"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[lib]
name = "july_workspace"
path = "src/lib.rs"

[[bin]]
name = "july"
path = "src/main.rs"

[profile.release]
strip = "symbols"

[dependencies]
agent-client-protocol = { version = "=2.0.0", default-features = false }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
crossterm = { version = "=0.29.0", features = ["event-stream"] }
futures-util = "=0.3.33"
libc = "=0.2.189"
pulldown-cmark = { version = "=0.13.4", default-features = false }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "unstable-rendered-line-info"] }
ratatui-textarea = { version = "=0.9.2", default-features = false, features = ["crossterm"] }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["io-std", "io-util", "macros", "rt", "signal", "sync", "time"] }
tracing = "=0.1.44"
tui-markdown = { version = "=0.3.9", default-features = false }
ulid = "=3.0.0"
unicode-width = "=0.2.2"
